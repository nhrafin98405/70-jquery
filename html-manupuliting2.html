<!DOCTYPE html>
<html lang="en">

</head>
<body>

    <p id="cng">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nisi, id repudiandae possimus explicabo illum neque suscipit veritatis consequatur, animi iste ex tempora beatae minima numquam, nulla ab corporis. Numquam, molestiae.</p>
    

    <button id="btn"> change css </button>

    <script>



            //  $(document).ready(function(){
            //     $('#btn').click(function(){
            //         $('#cng').html("<h1>Hellow World</h1>")
            //     })
            // })

            //  $(document).ready(function(){
            //     $('#btn').click(function(){
            //         $('#cng').text("<h1>Hellow World</h1>")
            //     })

             $(document).ready(function(){
                $('#btn').click(function(){
                    $('#cng').before("<h1>Hellow World</h1>")
                })
            })


             $(document).ready(function(){
                $('#btn').click(function(){
                    $('#cng').after("<h1>Hellow World</h1>")
                })
            })


             $(document).ready(function(){
                $('#btn').click(function(){
                    $('#cng').append("Hellow World")
                })
            })


             $(document).ready(function(){
                $('#btn').click(function(){
                    $('#cng').prepend("Hellow World")
                })
            })


    </script>
    
</body>
</html>
